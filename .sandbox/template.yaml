overview: |
  # iOS Development with macOS

  This sandbox provisions an EC2 Mac instance for iOS builds.
  The `dev` workspace owns the git checkout (and the coding agent). Mutagen keeps
  a two-way-synced copy on the Mac, and Mac-only tools run there over SSH.

  - **Mac Instance**: click the `macos` resource for connection details
  - **Run anything on the Mac**: `~/infra/scripts/mac-run.sh <command>` (e.g. `xcodebuild -list`)
  - **Build**: `~/infra/scripts/build-ios.sh <Scheme>` in the workspace terminal
  - **Sync status**: `~/infra/scripts/mac-run.sh true` flushes the sync, or check the `mac-sync` daemon log

workspaces:
  - name: dev
    checkouts:
      - path: my-ios-app                                # <-- REPLACE with your app directory name
        repo:
          git: https://github.com/myorg/my-ios-app      # <-- REPLACE with your iOS app repo URL
      - path: infra
        repo:
          git: https://github.com/crafting-demo/ec2-mac  # <-- REPLACE with your fork that holds scripts/
        manifest:
          overlays:
            - inline:
                hooks:
                  build:
                    cmd: ./scripts/install-mutagen.sh
                daemons:
                  mac-sync:
                    run:
                      cmd: ./scripts/mac-sync-daemon.sh
    wait_for:
      - macos
    env:
      - AWS_CONFIG_FILE=/run/sandbox/fs/secrets/shared/aws-config
      - MAC_REPO_DIR=/home/owner/my-ios-app             # <-- REPLACE with /home/owner/<your app directory>
      # - MAC_SYNC_IGNORES=Pods xcuserdata              # optional extra Mutagen ignore patterns

  - name: provisioner
    base_snapshot: oci://us-docker.pkg.dev/crafting-dev/sandbox/shared/workspace:latest
    checkouts:
      - path: infra
        repo:
          git: https://github.com/crafting-demo/ec2-mac  # <-- REPLACE with your fork that holds terraform/
    env:
      - AWS_CONFIG_FILE=/run/sandbox/fs/secrets/shared/aws-config

resources:
  - name: macos
    brief: "macOS: {{output.public_ip}}"
    details: |
      **EC2 Mac Instance**

      - Public IP: {{output.public_ip}}
      - Instance ID: {{output.instance_id}}
      - Host ID: {{output.host_id}}
      - Data volume: {{output.data_volume_id}} (mounted at `/Volumes/crafting-data`)

      Connect from the `dev` workspace terminal:
      ```
      ssh mac
      ```

      Resource state: `/run/sandbox/fs/resources/macos/state`
    terraform:
      workspace: provisioner
      dir: infra/terraform
      output: output
      save_state: true
      run:
        timeout: 30m0s
      # The Mac keeps running through suspend, so on_suspend changes nothing. It
      # still has to be present: it's what enables the `terraform apply` on
      # resume, which repairs drift and refreshes the saved resource state.
      on_suspend: {}
      on_delete: {}
